name: FacelessLab Auto Production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/auto-production.yml']
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: read
concurrency:
  group: facelesslab-auto-production
  cancel-in-progress: false
jobs:
  produce:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.FACELESSLAB_AUTO_ENABLED == 'true' && vars.FACELESSLAB_BUDGET_VERIFIED == 'true' && vars.FACELESSLAB_PUBLIC_ENABLED == 'true') || (github.event_name == 'push' && github.event.head_commit.message == 'Retry FacelessLab render-only pilot 2026-11-26')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check runner syntax
        run: node --check scripts/auto-produce.mjs
      - name: Validate configuration
        env:
          FACELESSLAB_EMAIL: ${{ secrets.FACELESSLAB_EMAIL }}
          FACELESSLAB_PASSWORD: ${{ secrets.FACELESSLAB_PASSWORD }}
        run: |
          test -n "$FACELESSLAB_EMAIL" && test -n "$FACELESSLAB_PASSWORD" || { echo "Configure the two FacelessLab Actions secrets first."; exit 1; }
      - name: Install headless browser
        run: |
          npm install --no-save --no-package-lock playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Run production
        env:
          FACELESSLAB_EMAIL: ${{ secrets.FACELESSLAB_EMAIL }}
          FACELESSLAB_PASSWORD: ${{ secrets.FACELESSLAB_PASSWORD }}
          FACELESSLAB_MODE: ${{ github.event_name == 'schedule' && vars.FACELESSLAB_PUBLIC_ENABLED == 'true' && vars.FACELESSLAB_BUDGET_VERIFIED == 'true' && 'public' || 'render-only' }}
        run: node scripts/auto-produce.mjs
