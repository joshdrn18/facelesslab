name: FacelessLab Auto Production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/auto-production.yml']
  schedule:
    # Start production an hour before the 12:00 and 20:00 WIB publish targets; audit includes account subscription plans.
    - cron: '0 4 * * *'
    - cron: '0 12 * * *'
permissions:
  contents: read
concurrency:
  group: facelesslab-auto-production
  cancel-in-progress: false
jobs:
  produce:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && (github.event.head_commit.message == 'Audit FacelessLab budget 2026-11-27' || github.event.head_commit.message == 'Prepare FacelessLab Part 22 draft'))
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check runner syntax
        run: node --check scripts/auto-produce.mjs
      - name: Validate configuration
        env:
          FACELESSLAB_EMAIL: ${{ secrets.FACELESSLAB_EMAIL }}
          FACELESSLAB_PASSWORD: ${{ secrets.FACELESSLAB_PASSWORD }}
        run: |
          test -n "$FACELESSLAB_EMAIL" && test -n "$FACELESSLAB_PASSWORD" || { echo "Configure the two FacelessLab Actions secrets first."; exit 1; }
      - name: Create Part 22 continuation draft
        if: github.event_name == 'push' && github.event.head_commit.message == 'Prepare FacelessLab Part 22 draft'
        env:
          FACELESSLAB_EMAIL: ${{ secrets.FACELESSLAB_EMAIL }}
          FACELESSLAB_PASSWORD: ${{ secrets.FACELESSLAB_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://facelesslab-api.joshdrn18.workers.dev';
          let token;
          async function api(path, method='GET', body) {
            const r = await fetch(base+path,{method,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},...(body===undefined?{}:{body:JSON.stringify(body)}),signal:AbortSignal.timeout(30000)});
            if(!r.ok) throw Error('FacelessLab request failed: '+r.status);
            return r.json();
          }
          try {
            token=(await api('/api/auth/login','POST',{email:process.env.FACELESSLAB_EMAIL,password:process.env.FACELESSLAB_PASSWORD})).token;
            if(!token) throw Error('Missing session');
            const projects=(await api('/api/projects')).projects||[];
            const parent=projects.find(p=>p.id==='f0e787d4-8084-44f5-9f45-3888c2e7b256'&&Number(p.episode_number)===21);
            if(!parent) throw Error('Expected Part 21 missing');
            const existing=projects.filter(p=>Number(p.episode_number)===22&&p.parent_project_id===parent.id);
            if(existing.length>1) throw Error('Duplicate continuation detected');
            if(!existing.length && projects.some(p=>Number(p.episode_number)===22)) throw Error('Part 22 lineage mismatch');
            const result=existing[0]||(await api('/api/projects/'+parent.id+'/continue','POST',{})).project;
            if(!result?.id||Number(result.episode_number)!==22) throw Error('Continuation not confirmed');
            console.log('Part 22 draft exists: '+result.id+'; status='+result.status);
          } finally {if(token) await api('/api/auth/logout','POST',{}).catch(()=>{});}
          NODE
      - name: Install headless browser
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.FACELESSLAB_AUTO_ENABLED == 'true' && vars.FACELESSLAB_BUDGET_VERIFIED == 'true' && vars.FACELESSLAB_PUBLIC_ENABLED == 'true')
        run: |
          npm install --no-save --no-package-lock playwright@1.51.1
          npx playwright install --with-deps chromium
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg
          command -v ffprobe
          command -v ffmpeg
      - name: Install audit dependency
        if: (github.event_name == 'push' && github.event.head_commit.message != 'Prepare FacelessLab Part 22 draft') || (github.event_name == 'schedule' && (vars.FACELESSLAB_AUTO_ENABLED != 'true' || vars.FACELESSLAB_BUDGET_VERIFIED != 'true' || vars.FACELESSLAB_PUBLIC_ENABLED != 'true'))
        run: npm install --no-save --no-package-lock playwright@1.51.1
      - name: Run production
        if: github.event_name != 'push' || github.event.head_commit.message != 'Prepare FacelessLab Part 22 draft'
        env:
          FACELESSLAB_EMAIL: ${{ secrets.FACELESSLAB_EMAIL }}
          FACELESSLAB_PASSWORD: ${{ secrets.FACELESSLAB_PASSWORD }}
          FACELESSLAB_MODE: ${{ github.event_name == 'schedule' && vars.FACELESSLAB_AUTO_ENABLED == 'true' && vars.FACELESSLAB_PUBLIC_ENABLED == 'true' && vars.FACELESSLAB_BUDGET_VERIFIED == 'true' && 'public' || (github.event_name == 'workflow_dispatch' && 'render-only' || 'budget-audit') }}
          FACELESSLAB_PUBLISH_SLOT: ${{ github.event.schedule == '0 4 * * *' && '12' || github.event.schedule == '0 12 * * *' && '20' || '' }}
        run: node scripts/auto-produce.mjs
