name: FacelessLab Auto Production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/auto-production.yml']
  schedule:
    # Start production an hour before the 12:00 and 20:00 WIB publish targets.
    - cron: '0 4 * * *'
    - cron: '0 12 * * *'
permissions:
  contents: read
concurrency:
  group: facelesslab-auto-production
  cancel-in-progress: false
jobs:
  produce:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.event.head_commit.message == 'Audit FacelessLab budget 2026-11-27')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check runner syntax
        run: node --check scripts/auto-produce.mjs
      - name: Validate configuration
        env:
          FACELESSLAB_EMAIL: ${{ secrets.FACELESSLAB_EMAIL }}
          FACELESSLAB_PASSWORD: ${{ secrets.FACELESSLAB_PASSWORD }}
        run: |
          test -n "$FACELESSLAB_EMAIL" && test -n "$FACELESSLAB_PASSWORD" || { echo "Configure the two FacelessLab Actions secrets first."; exit 1; }
      - name: Install headless browser
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.FACELESSLAB_AUTO_ENABLED == 'true' && vars.FACELESSLAB_BUDGET_VERIFIED == 'true' && vars.FACELESSLAB_PUBLIC_ENABLED == 'true')
        run: |
          npm install --no-save --no-package-lock playwright@1.51.1
          npx playwright install --with-deps chromium
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg
          command -v ffprobe
          command -v ffmpeg
      - name: Install audit dependency
        if: github.event_name == 'push' || (github.event_name == 'schedule' && (vars.FACELESSLAB_AUTO_ENABLED != 'true' || vars.FACELESSLAB_BUDGET_VERIFIED != 'true' || vars.FACELESSLAB_PUBLIC_ENABLED != 'true'))
        run: npm install --no-save --no-package-lock playwright@1.51.1
      - name: Run production
        env:
          FACELESSLAB_EMAIL: ${{ secrets.FACELESSLAB_EMAIL }}
          FACELESSLAB_PASSWORD: ${{ secrets.FACELESSLAB_PASSWORD }}
          FACELESSLAB_MODE: ${{ github.event_name == 'schedule' && vars.FACELESSLAB_AUTO_ENABLED == 'true' && vars.FACELESSLAB_PUBLIC_ENABLED == 'true' && vars.FACELESSLAB_BUDGET_VERIFIED == 'true' && 'public' || (github.event_name == 'workflow_dispatch' && 'render-only' || 'budget-audit') }}
          FACELESSLAB_PUBLISH_SLOT: ${{ github.event.schedule == '0 4 * * *' && '12' || github.event.schedule == '0 12 * * *' && '20' || '' }}
        run: node scripts/auto-produce.mjs
