name: Validate FacelessLab API

on:
  push:
    paths:
      - "src/index.js"
      - "public/index.html"
      - "scripts/check-inline-js.mjs"
      - ".github/workflows/validate-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Worker JavaScript syntax
        run: |
          node --check src/index.js
          node scripts/check-inline-js.mjs
          node --check .facelesslab-inline-check.js
