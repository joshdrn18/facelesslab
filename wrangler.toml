name = "facelesslab-api"
main = "src/index.js"
compatibility_date = "2026-11-01"


[vars]
AI_BASE_URL = "https://api.groq.com/openai/v1"
AI_MODEL = "openai/gpt-oss-20b"
APP_ENV = "production"
APP_NAME = "FacelessLab"
APP_ORIGIN = "https://facelesslab.pages.dev"


[[d1_databases]]
binding = "DB"
database_name = "facelesslab-db"
database_id = "e1e1693e-2508-4315-a580-dd601262d34a"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "facelesslab-media"

[ai]
binding = "AI"
